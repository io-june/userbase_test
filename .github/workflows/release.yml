name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.4xx'

      - name: Derive version from tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must look like v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-<prerelease>"
            exit 1
          fi
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          case "$version" in
            *-*) echo "IS_PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)   echo "IS_PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - name: Publish self-contained single-file
        run: >-
          dotnet publish UserBase/UserBase.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ env.APP_VERSION }} -o ${{ runner.temp }}/publish

      - name: Package
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "UserBase-$env:APP_VERSION-win-x64.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP/publish/UserBase.exe" -DestinationPath $zip -Force
          "ZIP_PATH=$zip" >> $env:GITHUB_ENV

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @($env:GITHUB_REF_NAME, $env:ZIP_PATH, '--repo', $env:GITHUB_REPOSITORY,
                         '--title', "UserBase $env:APP_VERSION", '--generate-notes', '--verify-tag')
          if ($env:IS_PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          gh release create @arguments